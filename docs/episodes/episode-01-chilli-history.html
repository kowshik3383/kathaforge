*{box-sizing:border-box}body{margin:0;background:#f6f0e2;color:#243428;font:16px/1.65 system-ui,sans-serif}main{max-width:900px;margin:auto;padding:24px}h1,h2{line-height:1.45;margin:0}header p{margin:4px 0 14px}.stage{min-height:240px;display:grid;place-items:center;align-content:center;gap:16px;padding:24px;text-align:center;background:#243c33;color:#fff5dc;border-radius:14px}.icon{font-size:72px;line-height:1}.animate{animation:enter .4s ease-out}@keyframes enter{from{transform:translateY(10px);opacity:.2}to{transform:translateY(0);opacity:1}}@media(prefers-reduced-motion:reduce){.animate{animation:none}}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0}.controls input{flex:1;min-width:120px}button{font:inherit;cursor:pointer;padding:6px 12px;background:#8c3a28;color:white;border:0;border-radius:7px}button:disabled{opacity:.55;cursor:default}.chapters{display:flex;gap:7px;flex-wrap:wrap}.chapters button{background:#395347}.chapters button[aria-current]{background:#8c3a28}.copy{padding:16px 18px;background:#fffcf6;border-radius:10px;margin:14px 0}.copy p{margin:0 0 8px}.hint{font-size:.9rem}

<main><header><p lang="en">KATHAFORGE · EPISODE 01 · STORYBOARD PREVIEW</p><h1>మిరప రాకముందు కారం ఎలా తెచ్చేవారు?</h1><p class="hint" lang="en">Illustrated placeholders and guide timings. Optional narration uses a Telugu voice installed on this device.</p></header>
<section class="stage" aria-label="దృశ్యం"><div class="icon" aria-hidden="true"></div><h2></h2></section>
<div class="controls" lang="en"><button id="play">Play</button><label for="seek">Timeline</label><input id="seek" type="range" min="0" max="275" value="0" step="1"><output id="clock" for="seek">0:00 / 4:35</output><button id="voice" disabled>Read scene aloud</button></div>
<nav class="chapters" aria-label="అధ్యాయాలు"></nav>
<section class="copy"><p id="script"></p><p id="shot"></p></section>
<script>
const scenes=[[0,"కారం ఎక్కడి నుంచి వచ్చింది?","🌶️","మిరపకాయలు లేని వంటగదిని ఒక్కసారి ఊహించండి. పచ్చడికి ఆ ఎరుపు కనిపించదు. బజ్జీ బండి దగ్గర మనం చూసే పచ్చిమిరప లేదు. మరి అప్పట్లో మన వంటల్లో ఘాటు కూడా లేదా? ఉంది. కానీ దానికి మిరపకాయ అవసరం లేదు. ఈ చిన్న ఎర్ర మిరప కథను వెనక్కి తిప్పితే మన గిన్నె నుంచి మొదలై, సముద్రం దాటి, మళ్లీ గుంటూరు మార్కెట్‌కి వస్తాం.","పచ్చడి మీద క్లోజప్. మిరపను ఫ్రేమ్ నుంచి తీసేసి పక్కన నల్ల మిరియాలు పెట్టండి."],[27,"మిరపకు ముందు","⚫","ముందుగా మిరియాలను చూడండి. ఇవి మిరపకాయల గింజలు కావు. నల్ల మిరియాలు వేరే మొక్క నుంచి వస్తాయి. దక్షిణ భారతదేశానికి చెందిన ఈ మసాలా పాత సముద్ర వాణిజ్యంలో ముఖ్యమైన సరుకు. మిరియాన్ని నలిపినప్పుడు వచ్చే వాసన, నాలుకపై వచ్చే ఘాటు, ఎండుమిరప రుచితో ఒకేలా ఉండవు. ఒక వంటలో ఎరుపు తగ్గిందంటే దాని రుచి కూడా తగ్గిపోయిందని అనుకోవాల్సిన పనిలేదు.","తెల్ల కాగితంపై నల్ల మిరియాలు, ఎండు మిరపను పక్కపక్కన చూపించండి. మధ్యలో వాటి పేర్లు పెట్టండి."],[62,"రెండు రకాల ఘాటు","🥣","ఇక్కడ ఒక చిన్న తేడా. మిరియాల ఘాటుకు పైపరిన్ అనే పదార్థం కారణం. మిరపకాయ ఘాటులో క్యాప్సైసిన్ ప్రధాన పాత్ర పోషిస్తుంది. రెండింటినీ మనం ‘కారం’ అని చెప్పొచ్చు. కానీ ఆ రెండు రుచులు ఒకదానికొకటి కచ్చితమైన ప్రత్యామ్నాయం కావు. ఒక గిన్నెలో మిరియాల పొడి, ఇంకో గిన్నెలో మిరప పొడి కలిపి చూడండి. రంగులో తేడా వెంటనే కనిపిస్తుంది. రుచిలో తేడా చెప్పాలంటే మన వంటగదే మంచి ఉదాహరణ.","రెండు గిన్నెల్లో ఒకే బేస్ వేసి భిన్నమైన మసాలాలు చూపించండి. దీన్ని ఆధునిక ఉదాహరణగా లేబుల్ చేయండి."],[97,"అమెరికాల నుంచి","🌎","మరి మనకు తెలిసిన మిరప కథ ఎక్కడ మొదలైంది? అమెరికా ఖండాల్లో. క్యాప్సికమ్ మొక్కలు అక్కడివి. అక్కడి ప్రజలు యూరోపియన్ల రాకకు ముందే మిరపలను సాగు చేసి వాడేవారు. ‘మిరపను యూరోపియన్లు కనిపెట్టారు’ అంటే ఈ కథలో చాలా భాగం మాయమైపోతుంది. జరిగింది ఏంటంటే, అప్పటికే ఒకచోట వాడుతున్న పంట తర్వాత సముద్ర మార్గాల ద్వారా ప్రపంచంలోని ఇతర ప్రాంతాలకు చేరింది.","అమెరికా ఖండాలను మ్యాప్‌లో చూపించండి. ‘యూరోపియన్ల రాకకు ముందు’ అనే లేబుల్ పెట్టండి."],[132,"సముద్రం దాటిన మిరప","⛵","పదిహేనో శతాబ్దం చివర తర్వాత అట్లాంటిక్ సముద్రం మీదుగా మొక్కలు, ఆహారాలు రెండు దిశలకూ కదిలాయి. ఆ పెద్ద మార్పులో మిరప కూడా భాగమే. భారతదేశానికి మిరప వ్యాప్తిలో పోర్చుగీసు సముద్ర వాణిజ్యానికి పాత్ర ఉందని చరిత్రకారులు చెబుతారు. మ్యాప్ మీద బాణం గీయడం సులువు. కానీ మన ఊరిలో ఏ ఇంట్లో మొదట మిరప వాడారో చెప్పడం అంత సులువు కాదు. పంట ఒక తీరానికి చేరడం ఒక సంఘటన. ఆ పంట రోజువారీ వంటల్లో చోటు సంపాదించడం మరో కథ.","అమెరికాలు, అట్లాంటిక్, భారతదేశం అనే మూడు లేబుళ్లతో పథక మ్యాప్. ఖచ్చితమైన ప్రయాణ మార్గంలా చూపించవద్దు."],[171,"పంట నుంచి పచ్చడికి","🫙","మిరపను పచ్చిగా వాడొచ్చు. ఎండబెట్టి నిల్వ చేయొచ్చు. పొడి చేసి పచ్చడిలో కలపొచ్చు. ఒకే పదార్థం చేతిలోకి వచ్చాక దాన్ని ఎన్ని రకాలుగా వాడగలమో ఆలోచించండి. ఇప్పుడు మన ఇంటి మిరప పొడి, పక్కింటి మిరప పొడి కూడా ఒకే రుచిగా ఉండకపోవచ్చు. వంటల్లో వచ్చిన మార్పును ఊహించుకోవడానికి ఇదొక మంచి దారి. కానీ ఈ రోజు మనం చేసే వంటను చూసి, ఇదే వంట వందల ఏళ్ల క్రితం ఇదేలా చేసేవారని తేల్చలేం.","పచ్చి మిరప నుంచి ఎండు మిరప, పొడి, ఆవకాయ వరకు నాలుగు మ్యాచ్ కట్లు. పాత వంటగా లేబుల్ చేయవద్దు."],[207,"గుంటూరు గుర్తింపు","📍","ఇప్పుడు మ్యాప్‌ని గుంటూరు వైపు తిప్పుదాం. గుంటూరు సన్నం మిరపకు భారతదేశంలో భౌగోళిక సూచిక నమోదు ఉంది. ఆ నమోదు మనకు ఒక నిర్దిష్ట మిరప పేరుకూ, ఒక ప్రాంతానికీ ఉన్న గుర్తింపు గురించి చెబుతుంది. ఇదే భారతదేశంలో మొదటి మిరప అని ఆ పత్రం చెప్పదు. కానీ దూరం నుంచి వచ్చిన ఒక పంటను మన ప్రాంతం ఎలా తన గుర్తింపులో భాగం చేసుకుందో అడగడానికి ఇది మంచి ఉదాహరణ.","భారతదేశం నుంచి గుంటూరుకు జూమ్. GI రిజిస్ట్రీలో నమోదైన పేరు చూపించి, లైసెన్స్ ఉన్న మార్కెట్ దృశ్యం లేదా సొంత ఫుటేజ్ వాడండి."],[241,"మళ్లీ వంటగదికి","🌶️","అయితే మిరప రాకముందు కారం ఎలా తెచ్చేవారు? మిరియాల లాంటి మసాలాలతో ఘాటు తెచ్చేవారు. తర్వాత అమెరికా ఖండాల నుంచి వచ్చిన మిరప ఇక్కడి వంటలకు మరో రుచి, మరో రంగు ఇచ్చింది. ఇప్పుడు మీరు ఇంట్లో ఆవకాయ జాడీ తెరిస్తే, అందులో మామిడి కథ ఒక్కటే లేదు. మసాలాలు ప్రపంచం చుట్టూ ఎలా ప్రయాణిస్తాయో చెప్పే కథ కూడా ఉంది. మీ ఇంట్లో మిరియాల ఘాటు బాగా తెలిసే వంట ఏది? పేరు కామెంట్‌లో చెప్పండి.","మొదటి గిన్నె షాట్‌కి తిరిగి రండి. చివర్లో ‘మీ ఇంటి మిరియాల వంట ఏది?’ అని స్క్రీన్‌పై పెట్టండి."]];
const $=id=>document.getElementById(id);
const buttons=[];
let previous=-1, elapsed=0, origin=0, frame=null;
function render(){
  const time=Math.floor(elapsed);
  let index=0;
  while(index+1<scenes.length&&scenes[index+1][0]<=time) index++;
  $('seek').value=time;
  $('clock').textContent=Math.floor(time/60)+':'+String(time%60).padStart(2,'0')+' / 4:35';
  if(index===previous)return;
  previous=index;
  const [,heading,emoji,script,shot]=scenes[index];
  document.querySelector('.stage h2').textContent=heading;
  const icon=document.querySelector('.icon');
  icon.classList.remove('animate');
  icon.textContent=emoji;
  requestAnimationFrame(()=>icon.classList.add('animate'));
  $('script').textContent=script;
  $('shot').textContent='దృశ్యం — '+shot;
  buttons.forEach((button,i)=>{if(i===index)button.setAttribute('aria-current','true');else button.removeAttribute('aria-current')});
}
function pause(){if(frame!==null)cancelAnimationFrame(frame);frame=null;$('play').textContent='Play'}
function tick(now){elapsed=Math.min(275,(now-origin)/1000);render();if(elapsed===275)pause();else frame=requestAnimationFrame(tick)}
function seek(time){elapsed=time;origin=performance.now()-time*1000;window.speechSynthesis?.cancel();render()}
$('play').onclick=()=>{if(frame!==null){pause();return}window.speechSynthesis?.cancel();if(elapsed>=275)seek(0);origin=performance.now()-elapsed*1000;$('play').textContent='Pause';frame=requestAnimationFrame(tick)};
$('seek').oninput=e=>seek(Number(e.target.value));
scenes.forEach(([time,name])=>{const button=document.createElement('button');button.textContent=name;button.onclick=()=>seek(time);document.querySelector('nav').append(button);buttons.push(button)});
if('speechSynthesis' in window){
  const synth=window.speechSynthesis;
  const findVoice=()=>synth.getVoices().find(v=>/^te(?:[-_]|$)/i.test(v.lang));
  const update=()=>{$('voice').disabled=!findVoice()};
  update();synth.addEventListener('voiceschanged',update);
  $('voice').onclick=()=>{const voice=findVoice();if(!voice)return;pause();synth.cancel();const line=new SpeechSynthesisUtterance(scenes[previous][3]);line.voice=voice;line.lang=voice.lang;synth.speak(line)};
}
render();
</script></main></html>
